name: chefcam
description: ChefCam — Escanea tu refri y cocina con IA

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  # Camera
  camera: ^0.10.5+9

  # Text to speech
  flutter_tts: ^4.0.2

  # Google Sign-In (solo el paquete de Flutter, la lógica de auth va al backend)
  google_sign_in: ^6.2.1

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
